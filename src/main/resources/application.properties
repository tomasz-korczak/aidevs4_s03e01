spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=INFO
logging.level.pl.tomaszko.s03e01=INFO
logging.file.name=logs/s03e01.log

spring.ai.openai.api-key=${OPENROUTER_API_KEY:}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.options.model=${app.llm.model}

app.llm.model=nvidia/nemotron-3-ultra-550b-a55b:free
app.operator-notes.prompt-template=classpath:prompts/operator-notes-system.st
app.hub.verify-url=https://hub.ag3nts.org/verify
